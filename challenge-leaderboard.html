<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="assets/images/lulhaven20dock20line20art202-64x42.png" type="image/x-icon">
<title>Haven Challenge Leaderboard</title>
<style>
  :root{ --navy:#1a237e; --navy-2:#11164d; --ink:#15171c; --paper:#f6f7fb; --line:#e3e6f0; --accent:#c8a24b; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--paper);line-height:1.6;}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px;}
  header.hero{background:var(--navy);color:#fff;padding:44px 0 52px;text-align:center;}
  header.hero .kicker{color:var(--accent);font-weight:800;letter-spacing:.13em;text-transform:uppercase;
        font-size:clamp(.82rem,2.4vw,1.05rem);margin:0 0 22px;}
  header.hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;letter-spacing:.02em;margin:0 0 12px;}
  header.hero p{font-size:1.05rem;opacity:.94;max-width:620px;margin:10px auto 0;}
  main{padding:40px 0 20px;}
  .boards{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:24px;}
  .board{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 26px;}
  .board h2{color:var(--navy);margin:0 0 16px;font-size:1.3rem;}
  .board ol{list-style:none;margin:0;padding:0;}
  .board li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:1.05rem;}
  .board li:last-child{border-bottom:0;}
  .place{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;
        display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.95rem;}
  .place.p1{background:var(--accent);color:#3a2e05;}
  .place.p2{background:#8f97b3;}
  .place.p3{background:#a9784b;}
  .empty{color:#7b8095;font-style:italic;padding:6px 0;}
  footer{padding:34px 0;text-align:center;color:#7b8095;font-size:.85rem;border-top:1px solid var(--line);margin-top:30px;}
  a{color:var(--navy);}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <p class="kicker">Haven Halloween Challenge</p>
  <h1>Leaderboard</h1>
  <p>Who's on top — not by how much. First, second, and third place on each board.
     No point totals, ever. <a href="/challenge-rules#judging" style="color:#fff;text-decoration:underline;">Why</a>.</p>
</div></header>
<main><div class="wrap">
  <div class="boards" id="boards">
    <div class="board"><h2>VM tier</h2><p class="empty">Loading…</p></div>
    <div class="board"><h2>Full tier</h2><p class="empty">Loading…</p></div>
  </div>
</div></main>
<footer><div class="wrap">lulhaven.com &middot; Haven runs on your network &mdash; a suite of internet tools, defined and controlled on your LAN.</div></footer>
<script>
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function renderBoard(title, names) {
  const div = document.createElement("div");
  div.className = "board";
  const h2 = document.createElement("h2");
  h2.textContent = title;
  div.appendChild(h2);
  if (!names || names.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No standings yet.";
    div.appendChild(p);
    return div;
  }
  const ol = document.createElement("ol");
  names.forEach((name, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="place p${i + 1}">${i + 1}</span><span>${esc(name)}</span>`;
    ol.appendChild(li);
  });
  div.appendChild(ol);
  return div;
}
(async () => {
  const boards = document.getElementById("boards");
  try {
    const r = await fetch("/api/challenge-leaderboard");
    if (!r.ok) throw new Error(String(r.status));
    const { vm, full } = await r.json();
    boards.innerHTML = "";
    boards.appendChild(renderBoard("VM tier", vm));
    boards.appendChild(renderBoard("Full tier", full));
  } catch (e) {
    boards.innerHTML = '<p class="empty">Leaderboard is unavailable right now.</p>';
  }
})();
</script>
</body>
</html>
