<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Haven — pan spike</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#000; overscroll-behavior:none;
               touch-action:none; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #bg { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  /* Targets live in a layer that gets the SAME transform as the backdrop, so they are
     pinned to the picture rather than the screen — a virus stays where it was put in
     the world while you pan across it. */
  #world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;
           pointer-events:none; }
  /* The virus is no longer a coloured circle. It is a canvas carrying the real
     creature — membrane deformed live, put through a light intensifier, with its
     own range and bearing tags. Proven in lab/blob.html before it came here.
     The element is larger than the creature so the brackets and readouts have room;
     it stays centred on the target, so hit detection and the radar are untouched. */
  .virus { position:absolute; transform:translate(-50%,-50%);
           transition:opacity .25s ease; }
  .virus.stalled { filter:grayscale(.75) brightness(.65); }
  .virus.dead { opacity:0; }
  /* Fires a brief flash from the crosshair so a shot is unmistakable without sound. */
  /* The shot, drawn the way it looks through a scope (Dave, 2026-08-05): the emitter sits
     BELOW the line of sight, so the beam appears to rise from the bottom of the view and
     converge on the crosshair. A solid projectile would arc and cross the sight line
     twice; a laser goes straight and crosses once — simpler, and it still leaves exactly
     one distance at which the crosshair tells the truth, which is where the depth
     mechanic will come from once viruses have distance. */
  /* width/height are MANDATORY here. An SVG with neither has an intrinsic size of
     300x150, and `inset:0` does not stretch a replaced element — so the beam was being
     drawn inside a small box in the top-left and clipped, which read as the shot
     ignoring the crosshair (Dave, 2026-08-05). */
  #beam { position:fixed; left:0; top:0; width:100%; height:100%;
          pointer-events:none; opacity:0; }
  #beam line { stroke-linecap:round; filter:drop-shadow(0 0 5px rgba(255,190,90,.9)); }
  #flash { position:fixed; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px;
           border-radius:50%; pointer-events:none; opacity:0;
           background:radial-gradient(circle, rgba(255,255,200,.85), rgba(255,120,60,0) 70%); }
  #flash.fire { animation:fl .22s ease-out; }
  @keyframes fl { from { opacity:.95; transform:scale(.45); } to { opacity:0; transform:scale(1.25); } }

  /* The crosshair sits at centre and RETURNS there — but a thumb can drag it off centre
     to reach the corners of the image, which the phone alone can never put under a fixed
     centre point once the background has hit its travel limit. Dave, 2026-08-05. */
  #cross { position:fixed; left:50%; top:50%; width:96px; height:96px;
           transform:translate(-50%,-50%); pointer-events:none; will-change:transform; }
  #cross .ring { position:absolute; inset:26px; border:2px solid rgba(255,60,60,.9);
                 border-radius:50%; box-shadow:0 0 8px rgba(255,0,0,.6), inset 0 0 6px rgba(255,0,0,.4); }
  #cross .h, #cross .v { position:absolute; background:rgba(255,60,60,.9);
                         box-shadow:0 0 6px rgba(255,0,0,.7); }
  #cross .h { left:0; right:0; top:50%; height:2px; margin-top:-1px; }
  #cross .v { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; }
  /* Red, and a quarter the size it was (Dave, 2026-08-06). Red is the one hue that
     cannot be mistaken for the phosphor green of the contacts, so the aim point stays
     findable however bright the thing behind it gets — which is why real sights use it. */
  #dot { position:fixed; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px;
         background:#ff5a50; border-radius:50%; pointer-events:none;
         box-shadow:0 0 4px rgba(255,60,50,.95), 0 0 9px rgba(255,40,40,.5);
         will-change:transform; }
  /* Chrome that describes the VIEW, not any one contact: what this instrument is
     hunting, and whether the crosshair is on something. Range and bearing live on
     the contacts themselves, because with three on screen a number in the corner is
     a fact with no owner. */
  #scopechrome { position:fixed; left:0; right:0; top:0; padding:10px 12px;
                 display:flex; justify-content:space-between; pointer-events:none;
                 font:600 13px/1 ui-monospace, Menlo, Consolas, monospace;
                 letter-spacing:1px; }
  #sLabel { color:rgba(120,255,150,.92); text-shadow:0 0 8px rgba(60,255,120,.5); }
  #sLock  { color:rgba(120,255,150,1); text-shadow:0 0 10px rgba(60,255,120,.8);
            opacity:0; transition:opacity .06s linear; }
  #sLock.on { opacity:1; }
  body:not(.started) #scopechrome { display:none; }
  /* A faint marker left at true centre while trimming, so it stays obvious how far the
     crosshair has been pulled off and which way it will snap back. */
  /* Radar (Dave, 2026-08-05): once targets can sit outside the view, the player needs to
     be told WHICH WAY to turn or they end up sweeping the room hunting. The whole world
     shrunk into a corner, with a box showing where you are looking inside it. Deliberately
     NOT hidden by the tap-to-hide toggle — that toggle exists to clear away instrumentation,
     and this is part of the game rather than something we bolted on to debug it. */
  /* Lives OUTSIDE #hud on purpose — a control that hides a panel cannot live inside the
     panel it hides, or there is no way back (Dave, 2026-08-05). Small and quiet, but
     always present, and its label always states what the next press will do. */
  /* Both of these are in-game furniture and have no business floating over the start
     screen — caught on a phone screenshot, 2026-08-05. `started` on <body> is the single
     switch. */
  body:not(.started) #bHide, body:not(.started) #radar { display:none; }
  #bHide { position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom));
           z-index:5; padding:9px 14px; font:600 12px/1 system-ui, sans-serif;
           color:#dff; background:rgba(18,49,42,.82); border:1px solid #2f6f5e;
           border-radius:8px; }
  #radar { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px;
           width:104px; height:57px; border:1px solid rgba(255,255,255,.30);
           border-radius:5px; background:rgba(0,10,8,.45); pointer-events:none; }
  #home { position:fixed; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px;
          border:1px solid rgba(255,255,255,.35); border-radius:50%; pointer-events:none;
          opacity:0; transition:opacity .15s ease; }
  #home.show { opacity:1; }

  /* movement factor, drawn as a bar so it can be watched rather than read */
  /* Moved INSIDE the panel and into normal flow. Pinned at a fixed distance from the
     bottom it drew straight through the readout as soon as the text grew a line
     (screenshot, 2026-08-05) — a fixed offset can only ever be right for one layout. */
  #mbar { height:3px; margin:0 0 5px; transition:opacity .18s ease;
          background:rgba(255,255,255,.14); border-radius:3px; overflow:hidden; }
  #mfill { height:100%; width:0%; background:#4fd6a8; transition:width .05s linear; }
  #mbar.locked #mfill { background:#666; }

  /* The readout used to eat the bottom of the screen permanently. Dave, 2026-08-05:
     "make this full screen so we can get rid of the navigation stuff at the top, and
     give me a little more landscape." So it collapses to a single thin strip, and
     TAPPING ANYWHERE on the picture hides it entirely — the instrument is there when
     wanted and gone when the point is to look at the scene. */
  /* The right padding RESERVES the hide button's corner. Without it the button row
     stretches under a fixed-position control and lands on top of re-centre — which is
     exactly what happened (Dave, 2026-08-05, screenshot off the phone). Reserving the
     space is the fix; nudging the button would just move the collision. */
  #hud { position:fixed; left:0; right:0; bottom:0;
         padding:6px 92px calc(6px + env(safe-area-inset-bottom)) 10px;
         font:10px/1.3 ui-monospace, Menlo, Consolas, monospace; color:#9fe8c8;
         background:linear-gradient(transparent, rgba(0,0,0,.72) 30%);
         transition:opacity .18s ease; }
  #hud.dim { opacity:0; pointer-events:none; }
  #hud.dim ~ #mbar { opacity:0; }
  #hud b { color:#fff; font-weight:600; }
  #hud .warn { color:#ffb3b3; }
  #hud .hold { color:#8fb; }
  .btns { display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .btns button { flex:1 1 auto; min-width:56px; padding:8px 4px; font:600 11px/1 system-ui, sans-serif;
                 color:#dff; background:#12312a; border:1px solid #2f6f5e; border-radius:8px; }
  .btns button.on { background:#2f6f5e; color:#fff; }

  #gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:20px; padding:28px; text-align:center; background:#07100e;
          font-family:system-ui, sans-serif; color:#cfe; }
  #gate h1 { font-size:21px; font-weight:700; color:#fff; }
  #gate p  { font-size:15px; line-height:1.6; max-width:24em; color:#9fc7b8; }
  #gate button { padding:16px 34px; font:700 17px system-ui, sans-serif; color:#04140f;
                 background:#4fd6a8; border:0; border-radius:11px; }
  #gate.hide { display:none; }
  #err { color:#ffb3b3; font-size:14px; max-width:26em; }
</style>
</head>
<body>

<div id="stage"><img id="bg" src="ar-backdrop.jpg" alt=""><div id="world"></div></div>

<button id="bHide">hide</button>
<canvas id="radar" width="208" height="114"></canvas>
<svg id="beam"><line id="beamline" stroke="#ffd98a" stroke-width="3"></line>
                <line id="beamcore" stroke="#fffbe8" stroke-width="1.2"></line></svg>
<div id="flash"></div>
<div id="home"></div>
<div id="cross"><span class="ring"></span><span class="h"></span><span class="v"></span></div>
<div id="dot"></div>
<div id="scopechrome"><span id="sLabel">IP42</span><span id="sLock">LOCK</span></div>
<div id="hud">
  <div id="mbar"><div id="mfill"></div></div>
  <div id="line1">waiting for motion…</div>
  <div id="line2"></div>
  <div id="line3"></div>
  <div class="btns">
    <button id="bInvX">flip L/R</button>
    <button id="bInvY">flip U/D</button>
    <button id="bFire">fire: AUTO</button>
    <button id="bAccel">accel: ON</button>
    <button id="bZero">re-centre</button>
  </div>
</div>

<div id="gate">
  <h1>Haven — pan spike</h1>
  <p>Hold the phone up like you are looking through it. Tap start, then turn your body left and right and tilt up and down.</p>
  <p>The crosshair never moves. The world moves behind it.</p>
  <button id="go">Start</button>
  <div id="err"></div>
</div>

<script>
(function () {
  var bg = document.getElementById('bg');
  var L1 = document.getElementById('line1'), L2 = document.getElementById('line2');
  var L3 = document.getElementById('line3');
  var gateEl = document.getElementById('gate'), err = document.getElementById('err');
  var mbar = document.getElementById('mbar'), mfill = document.getElementById('mfill');

  // ================= design spec (Dave, 2026-08-05) =================
  // A STILL IMAGE behind a fixed crosshair. No camera: no stitching, no permission,
  // no power drain, no edge-of-frame problem. At least 3x the viewport wide and 2x
  // tall, whole sweep about 45 degrees.
  //
  // ---- why the gyroscope directly, and not deviceorientation (rewritten 2026-08-05)
  // v1 used deviceorientation and jumped around even held still. Two causes, both mine:
  //   1. I registered BOTH 'deviceorientationabsolute' AND 'deviceorientation'. On
  //      Chrome/Android both fire, with DIFFERENT zero references — so alpha alternated
  //      between two frames of reference every event.
  //   2. Orientation is sensor-FUSED and includes the magnetometer, which wanders
  //      several degrees indoors near metal and mains wiring.
  // Reading rotationRate integrates the raw gyroscope: one stream, no compass, no
  // competing zeros. It drifts instead — which is what the movement gate below is for.
  //
  // ---- the movement gate (Dave's idea, 2026-08-05)
  // "if the phone's sitting still, you should know that from the accelerometer... maybe
  // you can tone back the motion from the gyroscope... create a factor of movement".
  // Exactly right, and it cures BOTH failure modes at once: a still phone integrates
  // nothing, so there is no jitter AND no accumulated drift. The factor is drawn as a
  // bar above the readout so it can be watched instead of trusted.
  var ARC_X   = 45;      // degrees across the full horizontal travel
  // MIN_H dropped from 2 to 1.6 for the window backdrop (2026-08-05). The city shot is
  // WIDE and SHORT while a phone held upright is tall and narrow, so demanding 2x the
  // viewport height meant magnifying the picture 2.65x and throwing away its sharpness.
  // 1.6 still leaves a real up-down range and the vertical arc auto-derives from it, so
  // degrees-per-pixel stays equal on both axes whatever image is dropped in.
  var MIN_W   = 3, MIN_H = 1.6;
  var ROT_FULL = 8.0;    // deg/sec that counts as unambiguously moving
  var ACC_FULL = 0.45;   // m/s^2 of linear acceleration that counts as moving
  var GATE_FLOOR = 0.07; // below this the phone is declared still and nothing integrates
  var SMOOTH  = 0.25;    // render lerp; the gate does the noise work, this just softens
  // Gravity-as-reference. REF_TAU is how long an "average setting" is taken over before
  // gravity is believed; DEADBAND is how far the picture may disagree with it before
  // anything happens at all — this is the part that buys a genuinely motionless image,
  // because inside it there is no correction signal to jitter. CORRECT_TAU is how
  // lazily it walks back once it does engage; slow enough to be invisible, fast enough
  // to beat the ~1.2 deg/sec of measured drift.
  var REF_TAU     = 0.5;   // seconds of smoothing on gravity's opinion
  var DEADBAND    = 3.0;   // degrees of disagreement tolerated with no correction
  var CORRECT_TAU = 2.5;   // seconds to ease away the excess beyond the deadband
  var STILL_RATE  = 10;    // deg/sec of total rotation below which the phone counts as held
  var STILL_DWELL = 0.35;  // seconds it must stay that way before gravity gets a vote
  var elevAvg = 0, stillFor = 0;

  // ================= POINTER ACCELERATION (Dave, 2026-08-05) =================
  // "most mouse settings have an acceleration value such that when you move the mouse
  // very slowly, you in effect have higher resolution... if I'm moving quickly, it just
  // goes ahead and moves quickly. But when I start moving slowly, it slows down a lot so
  // I can fine tune where the crosshair is touching."
  //
  // The same transfer function every desktop pointer uses, applied to rotation rate.
  // Two things fall out of one mechanism, which is why it may make the gravity work
  // moot: slow motion gets fine control for aiming, AND sensor noise — which IS slow
  // motion, by definition, since it is tiny wobble — gets multiplied by the small gain
  // and largely vanishes. The drift shrinks by the same factor for the same reason.
  //
  // THE COST, stated so nobody rediscovers it as a bug: with acceleration the image is
  // no longer a true 1:1 window on a fixed world. Sweep away fast and creep back slowly
  // and you do not land where you started — exactly like a mouse. That also undermines
  // the gravity correction, which only means something while screen position and real
  // tilt are the same quantity. Both are on switches so all four combinations can be felt.
  var accelOn   = true;
  var GAIN_SLOW = 0.25;    // multiplier at a crawl — the fine-aim zone
  var GAIN_FAST = 1.0;     // multiplier at speed — true 1:1
  var SLOW_RATE = 8;       // deg/sec at or below which gain is fully GAIN_SLOW
  var FAST_RATE = 60;      // deg/sec at or above which gain is fully GAIN_FAST
  var gain = 1, rot = 0;   // rot lives out here so the readout can show it

  // ================= TARGETS AND AUTO-FIRE (Dave, 2026-08-05) =================
  // "if we get the crosshair on a core it just automatically shoots, it doesn't require
  // us to have a finger on a button somewhere... Maybe we make it a selectable status".
  //
  // THE PARADOX HE SPOTTED, and its resolution. If the weapon fires when the crosshair
  // is on the CORE, then hitting the body-but-not-the-core becomes impossible and that
  // mechanic dies. So the weapon fires when the crosshair is on the VIRUS — anywhere on
  // it — and where you were pointing decides the outcome: core kills, body stalls. Auto
  // -fire removes the button press, not the skill, so the fine-aim gain still earns its
  // keep. The haptic buzz stays: the satisfaction was in the feedback, not the finger.
  //
  // Mode A chosen by Dave: a short DWELL on target before firing, so sweeping the
  // crosshair across a virus does not shoot and settling on one does. B (fire on touch)
  // would make wild strafing the winning strategy, which is exactly what the
  // acceleration curve exists to make unnecessary.
  //
  // ACCESSIBILITY, worth stating because it is the same idea twice: auto-fire IS the
  // one-handed mode. Dave raised two-handed play and noted he has a paralysis issue in
  // one arm, then proposed auto-fire — which removes the only thing the second hand was
  // required for. Positions below are in NATURAL image pixels so targets are pinned to
  // the world. T2 sits deliberately in the extreme corner of the picture, where the
  // phone ALONE cannot bring it to centre — that is the honest test of the thumb trim.
  var autoFire = true;
  var DWELL = 0.20;         // seconds on target before the shot goes
  var COOLDOWN = 0.45;      // seconds between shots
  // MEASURED 2026-08-06, not guessed. The old coordinates were authored for the tall
  // manga page and never moved when the 2048x1118 city photo replaced it: target 1 sat
  // 302px BELOW the image, target 3 was 1672px below it and past the right edge. They
  // were in empty world space.
  //
  // The reachable band is narrower than the image, because the window only travels as
  // far as the backdrop overhangs it: roughly x 157-1890, y 349-768 in image pixels on
  // a portrait phone. Everything here sits inside that, and the radii are sized for the
  // wide photo — the old r:150 came out nearly as wide as a phone screen.
  var TARGETS = [
    { ix: 1100, iy: 470, r: 85, cr: 20 },   // near the middle — the easy one
    { ix:  330, iy: 400, r: 78, cr: 18 },   // off to the left — turn to find it
    { ix: 1740, iy: 700, r: 78, cr: 18 }    // low and right — turn the other way
  ];
  var onTargetFor = 0, cooldownFor = 0, hits = 0, stalls = 0, aiming = null;

  var TAU2 = Math.PI * 2, gTick = 0;
  var lockEl = document.getElementById('sLock');

  // ---- desktop controls -------------------------------------------------
  // A phone turns; a desktop cannot. Arrows/WASD drive yaw and pitch directly, which
  // is the same pair of numbers the gyroscope writes — so the desktop is a genuine
  // rig for tuning, not a separate code path that can drift out of agreement.
  // The wheel zooms. Mouse DRAG is deliberately left alone: it is already the
  // crosshair trim, the exact analogue of the thumb, and stealing it for panning
  // would break the control that works.
  var ZOOM = 1, keys = {}, PAN_RATE = 34;   // degrees per second held
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s'].indexOf(k) < 0) return;
    keys[k] = true; e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('wheel', function (e) {
    ZOOM = clamp(ZOOM * (e.deltaY > 0 ? 0.92 : 1.087), 1, 4);
    layout();
    e.preventDefault();
  }, { passive: false });
  // Real heading when the hardware has one. ALWAYS state the provenance rather than
  // warning only when we think it is fake — headless browsers and emulators both
  // assert absolute:true with no magnetometer behind it, which defeated the
  // conditional version instantly (lab/blob.html, 2026-08-06).
  var azReal = null;
  window.addEventListener('deviceorientationabsolute', function (e) {
    if (e.alpha !== null && e.alpha !== undefined) azReal = (360 - e.alpha) % 360;
  }, true);

  // ================= THE CREATURE ==========================================
  // Lifted from lab/blob.html after it was settled there. Two things happen per
  // pixel: the membrane is deformed (walk back along the radius to find where this
  // pixel came from before the skin pushed out, so the contents are dragged with
  // the skin), and the colour is remapped — red and green channels exchanged, then
  // blended toward phosphor green. The blue skin survives the swap, which is what
  // keeps it reading as two materials.
  var SEED = new Image(); SEED.src = 'blob-seed.png';
  var seedReady = false, srcData = null, SRC = 256;
  SEED.onload = function () { seedReady = true; };

  var WARP = 0.26, GREEN = 0.40, GRAIN = 0.35, CHURN = 1.6;
  var SIZE_STEPS = [48, 64, 96, 128, 192, 256];

  function h3(i, j, k) {
    var n = Math.imul(i, 73856093) ^ Math.imul(j, 19349663) ^ Math.imul(k, 83492791);
    n = Math.imul(n ^ (n >>> 15), 2246822519);
    n = Math.imul(n ^ (n >>> 13), 3266489917);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 2147483648 - 1;
  }
  // Integer multiples of the angle only, so the outline closes on itself with no
  // kink at the seam; unrelated speeds so it never visibly repeats.
  function wobbleAt(a, tt, seed) {
    var k = CHURN, s = 1 + (CHURN - 1) * 0.85;
    return (Math.sin(a * 3 + tt * 0.70 * s + seed * 1.7) * 0.060
          + Math.sin(a * 5 - tt * 0.45 * s + seed * 3.1) * 0.038
          + Math.sin(a * 2 + tt * 0.31 * s + seed * 5.3) * 0.052
          + Math.sin(a * 7 + tt * 0.23 * s + seed * 2.2) * 0.022
          + Math.sin(a * 4 - tt * 0.97 * s + seed * 4.1) * 0.030 * k
          + Math.sin(a * 6 + tt * 1.31 * s + seed * 6.7) * 0.018 * k
          + Math.sin(a * 1 + tt * 0.53 * s + seed * 1.1) * 0.055 * k) * k;
  }
  function ensureSrc() {
    if (srcData || !seedReady) return srcData;
    var c = document.createElement('canvas'); c.width = c.height = SRC;
    var x = c.getContext('2d');
    x.clearRect(0, 0, SRC, SRC);
    x.drawImage(SEED, 0, 0, SRC, SRC);
    srcData = x.getImageData(0, 0, SRC, SRC).data;
    return srcData;
  }
  // Rendered at a resolution matched to how big it currently is on screen, and only
  // one target is recomputed per frame. Doing all three at full size every frame is
  // what would cook a phone.
  function renderCreature(tt, time, N) {
    var s = ensureSrc(); if (!s) return false;
    if (!tt.buf || tt.buf.width !== N) {
      tt.buf = document.createElement('canvas'); tt.buf.width = tt.buf.height = N;
      tt.bctx = tt.buf.getContext('2d');
      tt.bimg = tt.bctx.createImageData(N, N);
    }
    var d = tt.bimg.data, R = N / 2, LUT = 256, SR = SRC / 2, i;
    // NOT tt.r — that is the target's world radius, a number the game already owns.
    if (!tt.wlut) tt.wlut = new Float32Array(LUT);
    for (i = 0; i < LUT; i++) tt.wlut[i] = wobbleAt(i / LUT * TAU2, time, tt.seed);

    for (var py = 0; py < N; py++) {
      var yy = py - R + 0.5;
      for (var px = 0; px < N; px++) {
        var xx = px - R + 0.5, o = (py * N + px) * 4;
        var rr = Math.sqrt(xx * xx + yy * yy);
        var edge = (R - 1) - rr;
        if (edge <= 0) { d[o + 3] = 0; continue; }
        var cov = edge < 1 ? edge : 1;

        var ai = ((Math.atan2(yy, xx) / TAU2 + 1) * LUT) | 0;
        var wv = tt.wlut[ai & (LUT - 1)];
        var rn = rr / R;
        var u = (rn - 0.12) / 0.83;
        var ramp = u <= 0 ? 0 : (u >= 1 ? 1 : u * u * (3 - 2 * u));
        var kk = 1 - wv * WARP * ramp;
        var sx = SR + (xx / R) * kk * SR, sy = SR + (yy / R) * kk * SR;
        if (sx < 0 || sy < 0 || sx > SRC - 2 || sy > SRC - 2) { d[o + 3] = 0; continue; }

        var x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;

    draw();
    // While the thumb is down the crosshair tracks it exactly — any easing there would
    // feel like lag against your own finger. On release the target becomes zero and this
    // same lerp becomes the snap-back.
    if (dragging) { crossX = crossTX; crossY = crossTY; }
    else { crossX += (crossTX - crossX) * 0.3; crossY += (crossTY - crossY) * 0.3; }
    var ct = 'translate(-50%,-50%) translate3d(' + crossX + 'px,' + crossY + 'px,0)';
    crossEl.style.transform = ct;
    dotEl.style.transform = 'translate3d(' + crossX + 'px,' + crossY + 'px,0)';

    // --- what is under the crosshair, and does the weapon fire?
    var frameDt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.1) : 0.016;
    lastFrame = t;
    var aimX = vw / 2 + crossX, aimY = vh / 2 + crossY;
    aiming = null;
    var onCore = false;
    for (var i = 0; i < TARGETS.length; i++) {
      var tt = TARGETS[i];
      if (!tt.alive) continue;
      var sx = posX + tt.ix * scale, sy = posY + tt.iy * scale;
      var d = Math.hypot(aimX - sx, aimY - sy);
      if (d <= tt.r * scale) { aiming = tt; onCore = d <= tt.cr * scale; break; }
    }
    drawRadar();

    // One creature recomputed per frame, round-robin, at a resolution matched to how
    // big it is on screen. All three at full size every frame is what would make the
    // phone hot; this costs about a third of one.
    gTick++;
    var live = TARGETS.filter(function (x) { return x.alive && x.el; });
    if (live.length && seedReady) {
      var due = live[gTick % live.length];
      var want = Math.ceil(due.drawR * 2), N = SIZE_STEPS[SIZE_STEPS.length - 1];
      for (var q = 0; q < SIZE_STEPS.length; q++) {
        if (SIZE_STEPS[q] >= want) { N = SIZE_STEPS[q]; break; }
      }
      renderCreature(due, t / 1000, N);
      for (var q2 = 0; q2 < live.length; q2++) { tagFor(live[q2]); drawCreature(live[q2]); }
    }
    lockEl.classList.toggle('on', !!aiming);

    cooldownFor = Math.max(0, cooldownFor - frameDt);
    onTargetFor = aiming ? onTargetFor + frameDt : 0;
    if (autoFire && aiming && onTargetFor >= DWELL && cooldownFor === 0) {
      fire(aiming, onCore);
      cooldownFor = COOLDOWN;
      onTargetFor = 0;
    }
    if (t - rateAt > 1000) { lastRate = events; events = 0; rateAt = t; }
    if (started) {
      var pct = Math.round(gateVal * 100);
      mfill.style.width = pct + '%';
      mbar.classList.toggle('locked', gateVal === 0);
      // RAW rates first and biggest — this is the instrument. Turn left and watch
      // which of the three moves: that names the yaw axis and ends the guessing.
      L1.innerHTML = 'raw &alpha; <b>' + rA.toFixed(0) + '</b>&nbsp; &beta; <b>' +
                     rB.toFixed(0) + '</b>&nbsp; &gamma; <b>' + rG.toFixed(0) + '</b> &deg;/s' +
                     (haveRate === false
                        ? ' <span class="warn">— no rotationRate at all</span>' : '');
      L2.innerHTML = 'yaw <b>' + yaw.toFixed(1) +
                     '&deg;</b> pitch <b>' + pitch.toFixed(1) + '&deg;</b> &middot; ' +
                     lastRate + ' Hz &middot; arc ' + ARC_X + '&deg;';
      // pitch source, then the gyro's version beside it — the drift stays visible.
      // Says out loud whether gravity is doing anything RIGHT NOW, and by how much it
      // disagrees — so "is it correcting?" is never a thing to wonder about.
      var errNow = (elevAvg - elevZero) - pitch;
      var correcting = usePitchGravity && haveAcc &&
                       stillFor > STILL_DWELL && Math.abs(errNow) > DEADBAND;
      // Gain first — it is the thing being judged now. The bar shows it at a glance:
      // short bar = fine-aim territory, full bar = moving at speed.
      mfill.style.width = Math.round(gain * 100) + '%';
      var left = TARGETS.filter(function (x) { return x.alive; }).length;
      // Kept short enough not to wrap now that the panel reserves the hide button's
      // corner — a wrapped status line pushed the buttons around and read as a bug.
      L3.innerHTML = 'gain <b>' + gain.toFixed(2) + '</b>&times;' +
                     (aiming ? ' <span class="hold">ON TARGET</span>' : '') +
                     ' &middot; <b>' + hits + '</b> killed &middot; <b>' + stalls +
                     '</b> stalled &middot; <b>' + left + '</b> left' +
                     (usePitchGravity ? ' &middot; grav off by <b>' + errNow.toFixed(1) + '&deg;</b>' : '') +
                     (haveAcc === false ? ' <span class="warn">— no accelerometer</span>' : '');
    }
    requestAnimationFrame(tick);
  }

  bg.onload = function () { imgW = bg.naturalWidth; imgH = bg.naturalHeight; layout(); };
  if (bg.complete && bg.naturalWidth) bg.onload();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });

  // Real fullscreen, requested from inside the Start tap because browsers only grant it
  // during a user gesture. This is what removes Chrome's URL bar — and it also stops the
  // bar showing and hiding as you move, which was firing a resize storm at layout().
  function goFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el, { navigationUI: 'hide' }); } catch (e) { try { fn.call(el); } catch (e2) {} } }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(function () {});
    }
  }

  function listen() {
    window.addEventListener('devicemotion', onMotion, true);   // the ONLY motion source
    started = true;
    document.body.classList.add('started');
    goFullscreen();
    gateEl.classList.add('hide');
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});
    setTimeout(function () {
      if (!lastRate && !events) {
        L1.innerHTML = '<span class="warn">no motion events at all — the browser is not ' +
                       'delivering devicemotion</span>';
      }
    }, 2500);
  }

  document.getElementById('go').onclick = function () {
    var DME = window.DeviceMotionEvent;
    if (!DME) { err.textContent = 'This browser has no DeviceMotion support.'; return; }
    if (typeof DME.requestPermission === 'function') {          // iOS 13+
      DME.requestPermission().then(function (r) {
        if (r === 'granted') listen();
        else err.textContent = 'Motion access denied. Settings → Safari → Motion & Orientation Access.';
      }).catch(function (e) { err.textContent = 'Motion request failed: ' + e; });
    } else { listen(); }
  };

  function tog(id, fn, on) {
    var b = document.getElementById(id);
    if (on) b.classList.add('on');
    b.onclick = function () { fn(); b.classList.toggle('on'); };
  }
  tog('bInvX', function () { invX = -invX; });
  tog('bInvY', function () { invY = -invY; });
  // Dave, 2026-08-05: "When it says grab on, I don't know if that means I have to hit
  // the button to get grab on or grab is currently on." He is right, and it was the
  // same ambiguity on both toggles. A label that could be read as either a REPORT or a
  // COMMAND is unusable — so every toggle now reads "<thing>: STATE", which can only be
  // a report, and the highlight agrees with it. Momentary actions ("flip U/D",
  // "re-centre") stay as verbs, because those genuinely ARE commands.
  // The movement gate lost its button to the accel toggle — screen space is scarce and
  // acceleration suppresses still-phone noise far better than gating ever did. gateOn
  // stays false, so gateVal stays 1 and the gate is simply inert.
  var ab = document.getElementById('bAccel');
  ab.classList.toggle('on', accelOn);
  ab.onclick = function () {
    accelOn = !accelOn;
    ab.classList.toggle('on', accelOn);
    ab.textContent = 'accel: ' + (accelOn ? 'ON' : 'OFF');
  };
  // Re-centre now means "call wherever the phone is pointing right now the middle".
  // For yaw that still zeroes an accumulator; for pitch it moves the gravity reference.
  document.getElementById('bZero').onclick = function () {
    yaw = 0; pitchGyro = 0; elevZero = elev;
    // Also revives the targets. Purity would keep aim and score separate, but in a spike
    // being able to replay immediately is worth more than a second button.
    hits = 0; stalls = 0; onTargetFor = 0; cooldownFor = 0;
    TARGETS.forEach(function (t) {
      t.alive = true; t.stalled = false;
      t.el.classList.remove('dead', 'stalled');
    });
  };
  // Gravity correction is PARKED, not deleted (Dave, 2026-08-05: "I don't think we even
  // need that gravity anymore. I'm not sure."). Its button gave up the slot to show/hide.
  // It has been off since acceleration went in — acceleration suppresses the drift by the
  // same factor it damps slow motion — so nothing is lost today, and if pitch drift ever
  // returns this flag is the one line that brings the whole mechanism back.
  usePitchGravity = false;
  // The arc button gave up its slot: 45 degrees has been the settled spec all evening and
  // nobody has reached for it, whereas auto-fire is the thing being judged now.
  var fb = document.getElementById('bFire');
  fb.classList.toggle('on', autoFire);
  fb.onclick = function () {
    autoFire = !autoFire;
    fb.classList.toggle('on', autoFire);
    fb.textContent = 'fire: ' + (autoFire ? 'AUTO' : 'OFF');
  };

  // ================= THUMB TRIM (Dave, 2026-08-05) =================
  // "if I put my finger on the screen, I should be able to move my finger up, we'll move
  // the cross hair up... such that I could put the cross hair in the extreme upper left
  // hand corner. When I take my finger off the screen, the cross hair snaps back to the
  // centre."
  //
  // THE PROBLEM IT SOLVES, which had no name before: once the background reaches its
  // travel limit, panning stops. A crosshair welded to the centre therefore can NEVER be
  // put on anything near the image's edges or corners — that content is unhittable
  // however you hold the phone. Moving the CROSSHAIR rather than the background is the
  // clean fix, because it adds reach without undoing the aim just made with the phone.
  //
  // Relative (finger delta), not absolute (jump to finger), so the crosshair never
  // teleports out from under what you were looking at. Snap-back on release keeps the
  // resting state predictable — there is exactly one place the crosshair lives at rest.
  var stage = document.getElementById('stage');
  var homeEl = document.getElementById('home'), crossEl = document.getElementById('cross');
  var dotEl = document.getElementById('dot');
  var crossX = 0, crossY = 0, crossTX = 0, crossTY = 0;
  var dragging = false, dragTravel = 0, lastFX = 0, lastFY = 0;
  var TRIM_GAIN = 1.0;      // 1:1 with the finger, as described. Raise if the reach is bad.
  var TRIM_MARGIN = 30;     // keep the crosshair this far inside the screen edge

  function trimStart(x, y) {
    if (!started) return;
    dragging = true; dragTravel = 0;
    lastFX = x; lastFY = y;
    homeEl.classList.add('show');
  }
  function trimMove(x, y) {
    if (!dragging) return;
    var dx = (x - lastFX) * TRIM_GAIN, dy = (y - lastFY) * TRIM_GAIN;
    lastFX = x; lastFY = y;
    dragTravel += Math.abs(dx) + Math.abs(dy);
    crossTX = clamp(crossTX + dx, -(vw / 2 - TRIM_MARGIN), vw / 2 - TRIM_MARGIN);
    crossTY = clamp(crossTY + dy, -(vh / 2 - TRIM_MARGIN), vh / 2 - TRIM_MARGIN);
  }
  function trimEnd() {
    if (!dragging) return;
    dragging = false;
    crossTX = 0; crossTY = 0;          // snap home; the lerp in tick() eases it back
    homeEl.classList.remove('show');
  }

  // Show/hide is a BUTTON, not a tap (Dave, 2026-08-05). Tap-versus-drag detection kept
  // failing — a tap always slides a pixel, and Chrome synthesises a mouse click after
  // every touch, so the toggle fired twice and landed back where it started. A button
  // cannot be misread as a drag, which deletes the whole class of bug rather than
  // patching it. Its label always names what the NEXT press does.
  var hideBtn = document.getElementById('bHide');
  hideBtn.onclick = function (e) {
    e.stopPropagation();
    var hud = document.getElementById('hud');
    var nowHidden = hud.classList.toggle('dim');
    mbar.style.opacity = nowHidden ? '0' : '';
    hideBtn.textContent = nowHidden ? 'show' : 'hide';
  };

  // Chrome SYNTHESISES a mouse sequence after every touch, so the desktop fallback below
  // was running trimEnd a second time — the toggle fired twice and landed exactly where
  // it started, which is indistinguishable from nothing happening (Dave, 2026-08-05:
  // "tap to hide is not working for me"). Once a real touch is seen, the mouse path is
  // dead for the rest of the session.
  var sawTouch = false;

  stage.addEventListener('touchstart', function (e) {
    sawTouch = true;
    trimStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  stage.addEventListener('touchmove', function (e) {
    e.preventDefault();
    trimMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  stage.addEventListener('touchend', trimEnd);
  stage.addEventListener('touchcancel', trimEnd);

  // Mouse equivalents so the same code can be exercised from a desktop browser.
  stage.addEventListener('mousedown', function (e) {
    if (sawTouch) return; trimStart(e.clientX, e.clientY);
  });
  stage.addEventListener('mousemove', function (e) {
    if (sawTouch) return; trimMove(e.clientX, e.clientY);
  });
  stage.addEventListener('mouseup', function () { if (sawTouch) return; trimEnd(); });

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
