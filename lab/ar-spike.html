<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Haven — pan spike</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#000; overscroll-behavior:none;
               touch-action:none; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #bg { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

  /* the crosshair never moves. that is the whole point. */
  #cross { position:fixed; left:50%; top:50%; width:96px; height:96px;
           transform:translate(-50%,-50%); pointer-events:none; }
  #cross .ring { position:absolute; inset:26px; border:2px solid rgba(255,60,60,.9);
                 border-radius:50%; box-shadow:0 0 8px rgba(255,0,0,.6), inset 0 0 6px rgba(255,0,0,.4); }
  #cross .h, #cross .v { position:absolute; background:rgba(255,60,60,.9);
                         box-shadow:0 0 6px rgba(255,0,0,.7); }
  #cross .h { left:0; right:0; top:50%; height:2px; margin-top:-1px; }
  #cross .v { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; }
  #dot { position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
         background:#fff; border-radius:50%; pointer-events:none; box-shadow:0 0 4px #fff; }

  /* movement factor, drawn as a bar so it can be watched rather than read */
  #mbar { position:fixed; left:12px; right:12px; bottom:96px; height:5px;
          background:rgba(255,255,255,.14); border-radius:3px; overflow:hidden; }
  #mfill { height:100%; width:0%; background:#4fd6a8; transition:width .05s linear; }
  #mbar.locked #mfill { background:#666; }

  #hud { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         font:12px/1.45 ui-monospace, Menlo, Consolas, monospace; color:#9fe8c8;
         background:linear-gradient(transparent, rgba(0,0,0,.82) 35%); }
  #hud b { color:#fff; font-weight:600; }
  #hud .warn { color:#ffb3b3; }
  #hud .hold { color:#8fb; }
  .btns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .btns button { flex:1 1 auto; min-width:70px; padding:11px 6px; font:600 13px/1 system-ui, sans-serif;
                 color:#dff; background:#12312a; border:1px solid #2f6f5e; border-radius:8px; }
  .btns button.on { background:#2f6f5e; color:#fff; }

  #gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:20px; padding:28px; text-align:center; background:#07100e;
          font-family:system-ui, sans-serif; color:#cfe; }
  #gate h1 { font-size:21px; font-weight:700; color:#fff; }
  #gate p  { font-size:15px; line-height:1.6; max-width:24em; color:#9fc7b8; }
  #gate button { padding:16px 34px; font:700 17px system-ui, sans-serif; color:#04140f;
                 background:#4fd6a8; border:0; border-radius:11px; }
  #gate.hide { display:none; }
  #err { color:#ffb3b3; font-size:14px; max-width:26em; }
</style>
</head>
<body>

<div id="stage"><img id="bg" src="ar-backdrop.jpg" alt=""></div>

<div id="cross"><span class="ring"></span><span class="h"></span><span class="v"></span></div>
<div id="dot"></div>
<div id="mbar"><div id="mfill"></div></div>

<div id="hud">
  <div id="line1">waiting for motion…</div>
  <div id="line2"></div>
  <div class="btns">
    <button id="bInvX">flip L/R</button>
    <button id="bInvY">flip U/D</button>
    <button id="bArc">arc 45°</button>
    <button id="bGate">gate on</button>
    <button id="bZero">re-centre</button>
  </div>
</div>

<div id="gate">
  <h1>Haven — pan spike</h1>
  <p>Hold the phone up like you are looking through it. Tap start, then turn your body left and right and tilt up and down.</p>
  <p>The crosshair never moves. The world moves behind it.</p>
  <button id="go">Start</button>
  <div id="err"></div>
</div>

<script>
(function () {
  var bg = document.getElementById('bg');
  var L1 = document.getElementById('line1'), L2 = document.getElementById('line2');
  var gateEl = document.getElementById('gate'), err = document.getElementById('err');
  var mbar = document.getElementById('mbar'), mfill = document.getElementById('mfill');

  // ================= design spec (Dave, 2026-08-05) =================
  // A STILL IMAGE behind a fixed crosshair. No camera: no stitching, no permission,
  // no power drain, no edge-of-frame problem. At least 3x the viewport wide and 2x
  // tall, whole sweep about 45 degrees.
  //
  // ---- why the gyroscope directly, and not deviceorientation (rewritten 2026-08-05)
  // v1 used deviceorientation and jumped around even held still. Two causes, both mine:
  //   1. I registered BOTH 'deviceorientationabsolute' AND 'deviceorientation'. On
  //      Chrome/Android both fire, with DIFFERENT zero references — so alpha alternated
  //      between two frames of reference every event.
  //   2. Orientation is sensor-FUSED and includes the magnetometer, which wanders
  //      several degrees indoors near metal and mains wiring.
  // Reading rotationRate integrates the raw gyroscope: one stream, no compass, no
  // competing zeros. It drifts instead — which is what the movement gate below is for.
  //
  // ---- the movement gate (Dave's idea, 2026-08-05)
  // "if the phone's sitting still, you should know that from the accelerometer... maybe
  // you can tone back the motion from the gyroscope... create a factor of movement".
  // Exactly right, and it cures BOTH failure modes at once: a still phone integrates
  // nothing, so there is no jitter AND no accumulated drift. The factor is drawn as a
  // bar above the readout so it can be watched instead of trusted.
  var ARC_X   = 45;      // degrees across the full horizontal travel
  var MIN_W   = 3, MIN_H = 2;
  var ROT_FULL = 8.0;    // deg/sec that counts as unambiguously moving
  var ACC_FULL = 0.45;   // m/s^2 of linear acceleration that counts as moving
  var GATE_FLOOR = 0.07; // below this the phone is declared still and nothing integrates
  var SMOOTH  = 0.25;    // render lerp; the gate does the noise work, this just softens

  var vw=0, vh=0, imgW=0, imgH=0, scale=1, travX=0, travY=0, arcY=30;
  var invX = 1, invY = -1;          // U/D inverted by default — Dave, first run on the S10e
  // Dave, 2026-08-05: "take the accelerometer out of it and ignore the accelerometer
  // altogether for a moment" — isolating variables. Gate ships OFF; the button turns
  // it back on. With it off NOTHING reads the accelerometer; this is pure gyroscope.
  var gateOn = false;
  // ONE CHANGE AT A TIME (Dave, 2026-08-05): "there's no faster path to madness than
  // to change multiple factors and try to determine which factor has what effect."
  // I had three changes stacked in the previous build and was queuing three more.
  // So this build alters exactly ONE behaviour — the gate is off — and otherwise only
  // ADDS AN INSTRUMENT: the three raw rotation rates, printed. A readout changes
  // nothing, so it cannot confound the next measurement. Turning left and reading
  // which of alpha/beta/gamma moves will NAME the yaw axis, and then the axis change
  // is made once, knowing, instead of guessed a third time.
  var rA = 0, rB = 0, rG = 0;       // last raw rates, for the readout
  var yaw = 0, pitch = 0;           // degrees from centre, integrated from the gyro
  var move = 0, gateVal = 0;
  var tgtX=0, tgtY=0, posX=0, posY=0;
  var lastT = 0, events = 0, lastRate = 0, rateAt = 0, started = false;
  var haveRate = null;              // null unknown, true/false once devicemotion speaks

  function layout() {
    vw = window.innerWidth; vh = window.innerHeight;
    if (!imgW) return;
    scale = Math.max(MIN_W * vw / imgW, MIN_H * vh / imgH);
    var dw = imgW * scale, dh = imgH * scale;
    travX = dw - vw; travY = dh - vh;
    arcY = travX > 0 ? ARC_X * (travY / travX) : 30;   // same px per degree both axes
    bg.style.width = dw + 'px'; bg.style.height = dh + 'px';
    // Do NOT reset the position here. layout() runs on every resize, and Android
    // Chrome fires resize constantly as the URL bar shows and hides — so the old
    // `posX = tgtX = -travX/2` yanked the backdrop back to centre several times a
    // second while yaw and pitch kept their values. That is exactly what Dave saw:
    // "the yaw and pitch look accurate, the background's just not doing what the
    // yaw and pitch infer that the background should be doing" (2026-08-05).
    // Position is now a PURE FUNCTION of yaw/pitch and is assigned nowhere else.
    aim();
    draw();
  }
  // the single place yaw/pitch become a screen position
  function aim() {
    tgtX = -travX / 2 + invX * (yaw   / (ARC_X / 2)) * (travX / 2);
    tgtY = -travY / 2 + invY * (pitch / (arcY  / 2)) * (travY / 2);
  }
  function draw() { bg.style.transform = 'translate3d(' + posX + 'px,' + posY + 'px,0)'; }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function onMotion(e) {
    var r = e.rotationRate;
    if (!r || (r.alpha == null && r.beta == null && r.gamma == null)) {
      if (haveRate === null) haveRate = false;
      return;
    }
    haveRate = true;
    events++;

    var now = e.timeStamp || performance.now();
    var dt = e.interval ? e.interval / 1000 : (lastT ? (now - lastT) / 1000 : 0.016);
    lastT = now;
    if (dt <= 0 || dt > 0.25) dt = 0.016;          // ignore stalls / tab switches

    rA = r.alpha || 0; rB = r.beta || 0; rG = r.gamma || 0;
    // MEASURED on Dave's Galaxy S10e over ADB, 2026-08-05 — not derived from the spec,
    // because the spec was wrong here three times running. An 18-second recording while
    // he turned and tilted on cue:
    //   turning the body left  -> beta  ran 17..29 deg/s, alpha and gamma ~0
    //   tilting the phone up   -> alpha ran 13..20 deg/s
    //   gamma never exceeded 8 deg/s in either motion — it carries no usable signal,
    //   and it was the axis this code had driving yaw.
    // So yaw comes from beta and pitch from alpha on this device.
    var gz = rB, gx = rA;

    // --- the movement factor, from BOTH sensors
    var rot = Math.abs(gz) + Math.abs(gx);          // deg/sec
    var a = e.acceleration;                          // gravity already removed
    var acc;
    if (a && (a.x != null || a.y != null || a.z != null)) {
      acc = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    } else {
      var g = e.accelerationIncludingGravity || {};
      var m = Math.sqrt((g.x||0)*(g.x||0) + (g.y||0)*(g.y||0) + (g.z||0)*(g.z||0));
      acc = Math.abs(m - 9.81);                      // deviation from resting gravity
    }
    var raw = clamp(Math.max(rot / ROT_FULL, acc / ACC_FULL), 0, 1);
    move += (raw - move) * 0.3;
    gateVal = (!gateOn) ? 1 : (move < GATE_FLOOR ? 0 : move);

    yaw   = clamp(yaw   + gz * dt * gateVal, -ARC_X / 2, ARC_X / 2);
    pitch = clamp(pitch + gx * dt * gateVal, -arcY  / 2, arcY  / 2);

    aim();
  }

  function tick(t) {
    posX += (tgtX - posX) * SMOOTH;
    posY += (tgtY - posY) * SMOOTH;
    draw();
    if (t - rateAt > 1000) { lastRate = events; events = 0; rateAt = t; }
    if (started) {
      var pct = Math.round(gateVal * 100);
      mfill.style.width = pct + '%';
      mbar.classList.toggle('locked', gateVal === 0);
      // RAW rates first and biggest — this is the instrument. Turn left and watch
      // which of the three moves: that names the yaw axis and ends the guessing.
      L1.innerHTML = 'raw &alpha; <b>' + rA.toFixed(0) + '</b>&nbsp; &beta; <b>' +
                     rB.toFixed(0) + '</b>&nbsp; &gamma; <b>' + rG.toFixed(0) + '</b> &deg;/s' +
                     (haveRate === false
                        ? ' <span class="warn">— no rotationRate at all</span>' : '');
      L2.innerHTML = 'yaw <b>' + yaw.toFixed(1) +
                     '&deg;</b> pitch <b>' + pitch.toFixed(1) + '&deg;</b> &middot; ' +
                     (gateOn ? 'move ' + pct + '%' + (gateVal === 0 ?
                        ' <span class="hold">STILL</span>' : '') : 'gate off') +
                     ' &middot; ' + lastRate + ' Hz &middot; arc ' + ARC_X + '&deg;';
    }
    requestAnimationFrame(tick);
  }

  bg.onload = function () { imgW = bg.naturalWidth; imgH = bg.naturalHeight; layout(); };
  if (bg.complete && bg.naturalWidth) bg.onload();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });

  function listen() {
    window.addEventListener('devicemotion', onMotion, true);   // the ONLY motion source
    started = true;
    gateEl.classList.add('hide');
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});
    setTimeout(function () {
      if (!lastRate && !events) {
        L1.innerHTML = '<span class="warn">no motion events at all — the browser is not ' +
                       'delivering devicemotion</span>';
      }
    }, 2500);
  }

  document.getElementById('go').onclick = function () {
    var DME = window.DeviceMotionEvent;
    if (!DME) { err.textContent = 'This browser has no DeviceMotion support.'; return; }
    if (typeof DME.requestPermission === 'function') {          // iOS 13+
      DME.requestPermission().then(function (r) {
        if (r === 'granted') listen();
        else err.textContent = 'Motion access denied. Settings → Safari → Motion & Orientation Access.';
      }).catch(function (e) { err.textContent = 'Motion request failed: ' + e; });
    } else { listen(); }
  };

  function tog(id, fn, on) {
    var b = document.getElementById(id);
    if (on) b.classList.add('on');
    b.onclick = function () { fn(); b.classList.toggle('on'); };
  }
  tog('bInvX', function () { invX = -invX; });
  tog('bInvY', function () { invY = -invY; }, true);   // starts inverted
  var gb = document.getElementById('bGate');
  gb.classList.add('on');
  gb.onclick = function () {
    gateOn = !gateOn;
    gb.classList.toggle('on', gateOn);
    gb.textContent = gateOn ? 'gate on' : 'gate OFF';
  };
  document.getElementById('bZero').onclick = function () { yaw = 0; pitch = 0; };
  document.getElementById('bArc').onclick = function () {
    ARC_X = ARC_X === 45 ? 90 : (ARC_X === 90 ? 20 : 45);
    this.textContent = 'arc ' + ARC_X + '°';
    yaw = clamp(yaw, -ARC_X/2, ARC_X/2);
    layout();
  };

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
