<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven — Submissions</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1a2230;margin:0;background:#f5f7fa;}
  header{background:#0f2e4c;color:#fff;padding:16px 22px;font-weight:800;font-size:1.15rem;}
  main{max-width:1200px;margin:0 auto;padding:22px 16px 60px;}
  h2{margin:28px 0 8px;font-size:1.15rem;color:#0f2e4c;}
  .meta{color:#667;font-size:.85rem;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:.86rem;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top;}
  th{background:#eef3f8;font-weight:700;position:sticky;top:0;}
  tr:nth-child(even) td{background:#fafbfc;}
  .wrap{overflow-x:auto;}
  .login{max-width:360px;margin:60px auto;background:#fff;padding:26px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1);}
  .login h1{font-size:1.1rem;margin:0 0 14px;color:#0f2e4c;}
  input[type=password]{width:100%;padding:10px;border:1px solid #ccd3dc;border-radius:6px;font-size:1rem;box-sizing:border-box;}
  button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:6px;background:#1565c0;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;}
  button:hover{background:#0f4fa0;}
  .err{color:#c62828;font-size:.9rem;margin-top:10px;min-height:1.2em;}
  .empty{color:#889;padding:14px 0;}
  .refresh{float:right;font-size:.8rem;font-weight:600;}
  a.refresh{color:#fff;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<header>Haven — Challenge Submissions <a class="refresh" onclick="load()">↻ refresh</a></header>
<main id="main"><p class="empty">Loading…</p></main>

<script>
const M = document.getElementById('main');

function esc(v){return (v==null?'':String(v)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

function table(rows){
  if(!rows.length) return '<p class="empty">No submissions yet.</p>';
  const cols = Object.keys(rows[0]);
  let h = '<div class="wrap"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  for(const r of rows){ h += '<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>'; }
  return h+'</tbody></table></div>';
}

function loginView(msg){
  M.innerHTML =
    '<div class="login"><h1>Sign in</h1>'+
    '<input type="password" id="pw" placeholder="Build-maint password" autofocus>'+
    '<button onclick="doLogin()">Sign in</button>'+
    '<div class="err" id="err">'+(msg||'')+'</div></div>';
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  const pw = document.getElementById('pw').value;
  const r = await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){ load(); } else { document.getElementById('err').textContent = 'Invalid password.'; }
}

async function load(){
  M.innerHTML = '<p class="empty">Loading…</p>';
  const r = await fetch('/api/submissions',{headers:{'Accept':'application/json'}});
  if(r.status===401){ loginView(''); return; }
  if(!r.ok){ M.innerHTML = '<p class="err">Error loading ('+r.status+').</p>'; return; }
  const d = await r.json();
  const s = d.router_survey||[], a = d.challenge_applications||[];
  M.innerHTML =
    '<h2>Challenge-preview survey <span class="meta">('+s.length+')</span></h2>'+
    '<div class="meta">/challenge-preview → router_survey</div>'+ table(s) +
    '<h2>Challenge applications <span class="meta">('+a.length+')</span></h2>'+
    '<div class="meta">/challenge &amp; /challenge-apply → challenge_applications</div>'+ table(a);
}

load();
</script>
</body>
</html>
