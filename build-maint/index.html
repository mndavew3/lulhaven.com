<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Haven Build Maint</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a1f3d;
        color: #e0e6f0;
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
        background: #142b4d; border: 1px solid #1f3d6b;
        border-radius: 8px; padding: 32px; max-width: 380px; width: 100%;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 24px; font-size: 1.3em; font-weight: 600; }
    label { display: block; font-size: 0.85em; margin-bottom: 6px; color: #a0b3cf; }
    input[type=password] {
        width: 100%; padding: 10px 12px; font-size: 1em;
        background: #0a1f3d; border: 1px solid #2a4a7a; color: #e0e6f0;
        border-radius: 4px; outline: none;
    }
    input[type=password]:focus { border-color: #5588cc; }
    button {
        margin-top: 16px; width: 100%;
        padding: 10px 16px; font-size: 1em; font-weight: 500;
        background: #2858a8; color: #fff; border: 0; border-radius: 4px;
        cursor: pointer;
    }
    button:hover { background: #3469bc; }
    button:disabled { background: #1f3d6b; cursor: not-allowed; }
    .error {
        margin-top: 12px; color: #ff8888; font-size: 0.9em;
        min-height: 1.2em;
    }
    .hint { margin-top: 16px; font-size: 0.75em; color: #6f87a8; }
    .home-link {
        position: absolute; top: 16px; left: 16px;
        color: #a0b3cf; text-decoration: none; font-size: 0.9em;
    }
    .home-link:hover { color: #e0e6f0; }
</style>
</head>
<body>
<a class="home-link" id="home-link" href="/">← lulhaven.com</a>
<div class="card">
    <h1>Haven Build Maintenance</h1>
    <form id="auth-form">
        <label for="pw">Password</label>
        <input id="pw" type="password" autofocus autocomplete="off">
        <button id="submit" type="submit">Sign in</button>
        <div class="error" id="error"></div>
    </form>
    <div class="hint">Authorized operators only. All actions are logged.</div>
</div>
<script>
const form = document.getElementById("auth-form");
const pw = document.getElementById("pw");
const btn = document.getElementById("submit");
const err = document.getElementById("error");
const homeLink = document.getElementById("home-link");

// Capture where we came from so the bad-password redirect knows where to go.
// Falls back to "/" if referrer is empty, cross-origin, or inside /build-maint/
// (which would otherwise loop).
const RETURN_URL = (() => {
    const r = document.referrer;
    if (!r) return "/";
    try {
        const u = new URL(r);
        if (u.origin !== window.location.origin) return "/";
        if (u.pathname.startsWith("/build-maint")) return "/";
        return r;
    } catch {
        return "/";
    }
})();
homeLink.href = RETURN_URL;

// One-strike rule: any failed password attempt jettisons the user to the
// calling page. Server-side rate limiting would be stronger, but is not in
// place yet — so we make a wrong password expensive at the UX layer by
// forcing the user to navigate back here deliberately to try again.
form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    try {
        const res = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw.value }),
            credentials: "same-origin",
        });
        if (res.ok) {
            // Cookie set by server; navigate to list.
            window.location.href = "/build-maint/list.html";
        } else if (res.status === 401) {
            err.textContent = `Invalid password. Returning to ${RETURN_URL}…`;
            pw.value = "";
            pw.disabled = true;
            btn.disabled = true;
            setTimeout(() => { window.location.href = RETURN_URL; }, 1500);
        } else {
            const j = await res.json().catch(() => ({}));
            err.textContent = j.error || `Error ${res.status}`;
            btn.disabled = false;
        }
    } catch (e) {
        err.textContent = "Network error. Try again.";
        btn.disabled = false;
    }
});
</script>
</body>
</html>
